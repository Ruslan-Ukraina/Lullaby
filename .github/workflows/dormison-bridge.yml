name: dormison-bridge

# A Dormison release without a bridge -> the B1 ntdll.dll pair and the bridge
# (lsteamclient, steam.exe), built from Dormison's source at the commit that
# release was built from -> tests in Wine -> the signed bridge-<engine>-<rev> and
# bridge-manifest.json Lullaby.app reads (docs/RELEASING.md, DECISIONS P5-1).
# A build that fails gets an issue.
#
# Dry run (a dryrun-bridge-* tag, or "Run workflow" with dry_run): the TEST keys,
# nothing published, no issues; with nothing new it rebuilds the beta channel's
# engine, so the whole path still runs. The feed it would publish is an artifact.
#
# Nothing is published without the owner (Phase 6): a scheduled run builds a
# *candidate* with the TEST keys, keeps it as the run's artifact and opens an issue
# saying so. The owner tests it (PEAK, RE9), then "Run workflow" with promote_run =
# that run's id and dry_run off signs exactly those bytes with the release key and
# publishes them, without building again (a PE build is not byte-reproducible).
# "Run workflow" with engine = a version Dormison's manifest no longer names (e.g.
# dormison-r5) builds for it from the engineRelease a bridge entry recorded.

# The schedule is a parameter: repository variable LB_DORMISON_CHECK_HOURS (default 24, 0 = never
# by schedule, rounded up to a multiple of 24, how often the cron fires). The cron
# starts only a short Linux gate; the macOS job runs when a Dormison release has no bridge (DECISIONS P6-13).

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run with the TEST keys (publishes nothing)
        type: boolean
        default: true
      rebuild:
        description: Build a new revision for the beta channel's engine even if it has a bridge
        type: boolean
        default: false
      rev:
        description: Revision number to use (empty = one more than any known); never reuse an id
        type: string
        default: ""
      engine:
        description: Build for this engine instead of a channel's (e.g. dormison-r5; from bridge/bridge-manifest.json engineRelease)
        type: string
        default: ""
      promote_run:
        description: Publish the bridge a previous run of this workflow built (its run id); builds nothing
        type: string
        default: ""
  push:
    tags: ["dryrun-bridge-*"]

permissions:
  contents: write
  issues: write
  # promote reads the tested candidate's run and artifact
  actions: read

concurrency:
  group: release-feed
  cancel-in-progress: false

env:
  # Only "Run workflow" with dry_run off uses the release key; a schedule or a tag never does.
  DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == true }}
  # A scheduled build is a candidate: TEST keys, not published, but it opens issues.
  CANDIDATE: ${{ github.event_name == 'schedule' }}
  REBUILD: ${{ inputs.rebuild == true }}
  REV: ${{ inputs.rev }}
  ENGINE_PIN: ${{ inputs.engine }}
  # The compiler the bridge is built with on the owner's Mac (INDEPENDENCE I4):
  # Homebrew moving to another mingw-w64 GCC stops the build instead of changing it.
  MINGW_GCC_VERSION: "16.2.0"
  # Pinned in Sevoflurane's Core/Setup/EngineSignature.swift (engine/fetch-dormison.sh).
  DORMISON_PUBKEY: 7uDuIZdCZyobjZcPL12zL+UNOCpHSvLXvVRFHA7bzzA=

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - name: Anything to do
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HOURS: ${{ vars.LB_DORMISON_CHECK_HOURS }}
          DEFAULT_HOURS: "24"
          CRON_HOURS: "24"
          LB_RELEASE_PRIVATE_KEY: ${{ secrets.LB_RELEASE_PRIVATE_KEY }}
        run: |
          release/ci-gate.sh dormison | tee -a "$GITHUB_OUTPUT"
          grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2- >> "$GITHUB_STEP_SUMMARY"

  bridge:
    needs: gate
    if: needs.gate.outputs.run == 'true' && inputs.promote_run == ''
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Where to publish (release/feed.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$DRY_RUN" = true ] || release/gh-publish.sh check-repo
          { echo "FEED=$(python3 -I release/feed.py config feed)"
            echo "MANIFEST_TAG=$(python3 -I release/feed.py config manifestTag)"
            echo "DORMISON_MANIFEST=$(python3 -I release/feed.py config engineManifest)"; } >> "$GITHUB_ENV"

      - name: Keys
        id: keys
        env:
          LB_RELEASE_PRIVATE_KEY: ${{ secrets.LB_RELEASE_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          LB_RELEASE_PUBLIC_KEY: ${{ vars.LB_RELEASE_PUBLIC_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          mode=release; [ "$DRY_RUN" = true ] && mode=dry-run
          rc=0; release/ci-keys.sh "$mode" "$RUNNER_TEMP/keys" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::notice::The release keys are not set up yet (docs/RELEASING.md); nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"

      - name: Which engine needs a bridge
        id: detect
        if: steps.keys.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # What is published carries the release key, whatever key this run signs with.
          PUBLISHED_KEY: ${{ vars.LB_RELEASE_PUBLIC_KEY }}
        run: |
          swiftc -O -o "$RUNNER_TEMP/verify-ed25519" engine/verify-ed25519.swift
          d="$RUNNER_TEMP/dormison"; mkdir -p "$d"
          curl -fsSL -o "$d/engine.json" "$DORMISON_MANIFEST"
          curl -fsSL -o "$d/engine.json.sig" "$DORMISON_MANIFEST.sig"
          "$RUNNER_TEMP/verify-ed25519" "$DORMISON_PUBKEY" "$d/engine.json" "$d/engine.json.sig"
          current=""
          # A candidate reads what is published too, so it builds only an engine without a bridge.
          if { [ "$DRY_RUN" != true ] || [ "$CANDIDATE" = true ]; } && [ -n "$PUBLISHED_KEY" ] \
            && release/gh-publish.sh fetch "$MANIFEST_TAG" bridge-manifest.json "$RUNNER_TEMP/current"; then
            release/gh-publish.sh verify "$PUBLISHED_KEY" "$RUNNER_TEMP/current/bridge-manifest.json"
            current="$RUNNER_TEMP/current/bridge-manifest.json"
            echo "CURRENT=$current" >> "$GITHUB_ENV"
          fi
          engine_json="$d/engine.json"
          if [ -n "$ENGINE_PIN" ]; then
            python3 -I release/feed.py pin-engine --engine "$ENGINE_PIN" --out "$d/pin.json" \
              bridge/bridge-manifest.json "$current"
            engine_json="$d/pin.json"
          fi
          echo "ENGINE_JSON=$engine_json" >> "$GITHUB_ENV"
          rebuild_any=$DRY_RUN; [ "$CANDIDATE" = true ] && rebuild_any=false
          python3 -I - "$engine_json" bridge/bridge-manifest.json "$current" "$rebuild_any" "$REBUILD" "$REV" "$ENGINE_PIN" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          engine, repo, current, dry_run, rebuild, forced, pin = sys.argv[1:8]
          channels = json.load(open(engine))["channels"]
          entries = json.load(open(repo))["bridges"] + (json.load(open(current))["bridges"] if current else [])
          def revs(version): return [e["rev"] for e in entries if e["engine"] == version]
          # The beta channel first: it is the one Lullaby ships with today.
          order = [c for c in ("beta", "stable") if c in channels and channels[c].get("version")]
          target = next((c for c in order if not revs(channels[c]["version"])), None)
          if target is None and (rebuild == "true" or dry_run == "true") and order:
              target = order[0]
          if pin:
              target = "pin"  # asked for by name: built even when it has a bridge
          if target is None:
              print("skip=true")
              print("versions:", {c: channels[c]["version"] for c in order}, "all have a bridge", file=sys.stderr)
          else:
              version = channels[target]["version"]
              print(f"channel={target}")
              print(f"engine={version}")
              rev = max(revs(version) + [0]) + 1
              if forced:
                  if int(forced) in revs(version):
                      sys.exit(f"bridge-{version}-{forced} exists already; an id is never reused")
                  rev = int(forced)
              print(f"rev={rev}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Nothing to build
        if: steps.keys.outputs.skip != 'true' && steps.detect.outputs.skip == 'true'
        run: echo "Every Dormison release on a channel has a bridge." >> "$GITHUB_STEP_SUMMARY"

      - name: Toolchain
        if: steps.detect.outputs.engine
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          brew install mingw-w64 bison flex freetype pkgconf
          x86_64-w64-mingw32-gcc --version | head -1
          for cc in x86_64-w64-mingw32-gcc i686-w64-mingw32-gcc; do
            got=$($cc -dumpfullversion 2>/dev/null || $cc -dumpversion)
            if [ "$got" != "$MINGW_GCC_VERSION" ]; then
              echo "::error::$cc is $got, the bridge is built with $MINGW_GCC_VERSION (INDEPENDENCE I4)." \
                "Build and test the bridge with $got on the owner's Mac first, then change MINGW_GCC_VERSION."
              exit 1
            fi
          done
          echo "mingw-w64 GCC $MINGW_GCC_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch and check the engine
        id: engine
        if: steps.detect.outputs.engine
        env:
          CHANNEL: ${{ steps.detect.outputs.channel }}
        run: |
          pin=""; [ "$CHANNEL" = pin ] && pin="$ENGINE_JSON"
          PIN_JSON="$pin" CHANNEL="$CHANNEL" MANIFEST_URL="$DORMISON_MANIFEST" RUNNERS="$RUNNER_TEMP/runners" \
            CACHE="$RUNNER_TEMP/engine" engine/fetch-dormison.sh --activate
          eng=$(cd -P "$RUNNER_TEMP/runners/current" && pwd)
          version=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$eng/engine-info.json")
          commit=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"])' "$eng/engine-info.json")
          [ "$version" = "${{ steps.detect.outputs.engine }}" ] || { echo "the $CHANNEL channel moved to $version"; exit 1; }
          echo "ENGINE=$eng" >> "$GITHUB_ENV"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "### $version ($commit), bridge rev ${{ steps.detect.outputs.rev }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dormison's source at the engine's commit
        if: steps.detect.outputs.engine
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/kageroumado/dormison.git "$RUNNER_TEMP/dormison-repo"
          echo "DORMISON_REPO=$RUNNER_TEMP/dormison-repo" >> "$GITHUB_ENV"
          echo "WINE_COMMIT=${{ steps.engine.outputs.commit }}" >> "$GITHUB_ENV"

      - name: Patch registry (a patch without a header or a registry entry stops the gate)
        if: steps.detect.outputs.engine
        run: make patchcheck

      - name: Rehearse the patches on the new tag (informational; build-fixes below is the gate)
        if: steps.detect.outputs.engine
        run: |
          # A patch that stacks on an earlier one reads FAIL here (each is tried alone);
          # the real test is build-fixes, which applies them in order.
          tag="${{ steps.detect.outputs.engine }}"; tag="${tag#dormison-}"
          git -C "$DORMISON_REPO" fetch --tags -q
          { echo '```'; patches/engine/rehearse.sh "$DORMISON_REPO" patches/engine/patches "$tag"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure the wine tree
        if: steps.detect.outputs.engine
        run: bridge/setup-wine-tree.sh

      - name: Build the B1 ntdll.dll pair
        if: steps.detect.outputs.engine
        run: |
          OUT="$PWD/scratch/ntdll-b1/${{ steps.detect.outputs.engine }}" ntdll-patch/b1/build-b1.sh --check-base

      - name: Build the engine fixes (patches/engine/, each first proven equal to the release)
        if: steps.detect.outputs.engine
        run: |
          OUT="$PWD/scratch/patches/engine/${{ steps.detect.outputs.engine }}" patches/engine/build-fixes.sh
          { echo '```'; cat "scratch/patches/engine/${{ steps.detect.outputs.engine }}/fixes.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build lsteamclient and steam.exe
        if: steps.detect.outputs.engine
        run: |
          lsteamclient/build.sh
          steam-shim/build.sh
          files="$RUNNER_TEMP/bridge-files"; mkdir -p "$files"
          b=scratch/dormison-build
          cp "$b/programs/steam.exe/x86_64-windows/steam.exe" "$files/steam.exe"
          cp "$b/dlls/lsteamclient/x86_64-windows/lsteamclient.dll" "$files/x86_64-windows-lsteamclient.dll"
          cp "$b/dlls/lsteamclient/lsteamclient.so" "$files/x86_64-unix-lsteamclient.so"
          cp "$b/dlls/lsteamclient/i386-windows/lsteamclient.dll" "$files/i386-windows-lsteamclient.dll"
          # Shipped without debug information (OPTIMIZATION O1); the hook test below runs the stripped files.
          bridge/strip-debug.sh "$files" "$RUNNER_TEMP/bridge-debug"
          file "$files"/*

      - name: Test the hook in Wine (x86_64 and i386)
        if: steps.detect.outputs.engine
        run: |
          t="$RUNNER_TEMP/bridge-test"; f="$RUNNER_TEMP/bridge-files"
          BRIDGE_DIR="$t" bridge/fetch-valve.sh --install
          mkdir -p "$t/x86_64-windows" "$t/i386-windows" "$t/x86_64-unix"
          cp "$f/x86_64-windows-lsteamclient.dll" "$t/x86_64-windows/lsteamclient.dll"
          cp "$f/i386-windows-lsteamclient.dll" "$t/i386-windows/lsteamclient.dll"
          cp "$f/x86_64-unix-lsteamclient.so" "$t/x86_64-unix/lsteamclient.so"
          cp "$f/x86_64-windows-lsteamclient.dll" "$t/lsteamclient.dll"
          cp "$f/x86_64-unix-lsteamclient.so" "$t/lsteamclient.so"
          b1="scratch/ntdll-b1/${{ steps.detect.outputs.engine }}"
          BRIDGE_DIR="$t" WORK="$RUNNER_TEMP/b1-test" ntdll-patch/b1/test-b1.sh "$b1" | tee "$RUNNER_TEMP/b1-test.log"
          # The control: the release's own ntdll.dll must not lead to lsteamclient.
          if BRIDGE_DIR="$t" WORK="$RUNNER_TEMP/b1-test" ntdll-patch/b1/test-b1.sh --clean > "$RUNNER_TEMP/b1-clean.log" 2>&1; then
            echo "the release's ntdll.dll passed the hook test, so the test proves nothing"; exit 1
          fi
          { echo '```'; grep -E "^(OK|FAIL) |arch\(es\)" "$RUNNER_TEMP/b1-test.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Package and sign
        if: steps.detect.outputs.engine
        run: |
          feed="$RUNNER_TEMP/feed"
          python3 -I release/feed.py bridge-artifact --files-dir "$RUNNER_TEMP/bridge-files" \
            --b1-dir "scratch/ntdll-b1/${{ steps.detect.outputs.engine }}" \
            --fixes-dir "scratch/patches/engine/${{ steps.detect.outputs.engine }}" \
            --engine-json "$ENGINE_JSON" \
            --engine "${{ steps.detect.outputs.engine }}" --commit "${{ steps.engine.outputs.commit }}" \
            --rev "${{ steps.detect.outputs.rev }}" --feed "$FEED" --out "$feed"
          id="bridge-${{ steps.detect.outputs.engine }}-${{ steps.detect.outputs.rev }}"
          python3 -I release/feed.py publish-bridges --repo bridge/bridge-manifest.json \
            ${CURRENT:+--current "$CURRENT"} --out "$feed/manifest/bridge-manifest.json" "$feed/$id.entry.json"
          swift release/sign.swift "$RUNNER_TEMP/keys/release.key" "$feed/$id/$id.tar.xz" "$feed/manifest/bridge-manifest.json"
          release/gh-publish.sh verify "$LB_RELEASE_KEY" "$feed/$id/$id.tar.xz"
          release/gh-publish.sh verify "$LB_RELEASE_KEY" "$feed/manifest/bridge-manifest.json"
          # The unstripped files, beside the release for reading a crash; the app never fetches them.
          COPYFILE_DISABLE=1 tar -cJf "$feed/$id/$id-debug.tar.xz" -C "$RUNNER_TEMP" bridge-debug
          echo "ID=$id" >> "$GITHUB_ENV"
          { echo "Packaged \`$id\`:"; echo '```json'; cat "$feed/$id.entry.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Gather the run's output
        if: always() && steps.detect.outputs.engine
        run: |
          # One root for the artifact, so it unpacks as feed/… and logs/… (release.yml reads it).
          mkdir -p "$RUNNER_TEMP/logs"
          cp scratch/ntdll-b1/*/b1.json scratch/ntdll-b1/*/build.log "$RUNNER_TEMP/logs/" 2>/dev/null || true
          mv "$RUNNER_TEMP"/b1-*.log "$RUNNER_TEMP/logs/" 2>/dev/null || true

      - name: Keep the run's output
        if: always() && steps.detect.outputs.engine
        uses: actions/upload-artifact@v5
        with:
          name: dormison-bridge
          path: |
            ${{ runner.temp }}/feed
            ${{ runner.temp }}/logs
          if-no-files-found: ignore

      - name: Publish
        if: steps.detect.outputs.engine && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          feed="$RUNNER_TEMP/feed"
          release/gh-publish.sh upload "$ID" "Steam bridge $ID" "$feed/$ID/$ID.tar.xz" "$feed/$ID/$ID.tar.xz.sig" \
            "$feed/$ID/$ID-debug.tar.xz"
          release/gh-publish.sh upload "$MANIFEST_TAG" "Signed manifests" \
            "$feed/manifest/bridge-manifest.json" "$feed/manifest/bridge-manifest.json.sig"
          back="$RUNNER_TEMP/published"
          release/gh-publish.sh fetch "$MANIFEST_TAG" bridge-manifest.json "$back"
          cmp "$back/bridge-manifest.json" "$feed/manifest/bridge-manifest.json"
          release/gh-publish.sh fetch "$ID" "$ID.tar.xz" "$back"
          cmp "$back/$ID.tar.xz" "$feed/$ID/$ID.tar.xz"
          echo "Published $ID and the bridge manifest; both read back and match." >> "$GITHUB_STEP_SUMMARY"

      - name: Report a failed build
        if: failure() && steps.detect.outputs.engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Steam bridge for ${{ steps.detect.outputs.engine }} did not build"
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The dormison-bridge workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Lullaby does not offer ${{ steps.detect.outputs.engine }} until it has a bridge (DECISIONS P5-1)."
          } > "$body"
          if [ "$DRY_RUN" = true ] && [ "$CANDIDATE" != true ]; then
            echo "Dry run, would open: **$title**" >> "$GITHUB_STEP_SUMMARY"
          else
            release/gh-publish.sh issue "$title" "$body"
          fi

      - name: Report a candidate waiting for the owner
        if: success() && steps.detect.outputs.engine && env.CANDIDATE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Steam bridge candidate for ${{ steps.detect.outputs.engine }} is built, not published"
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The dormison-bridge workflow built \`$ID\` (TEST key): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Nothing is published. After the owner's game check (PEAK, RE9): Run workflow → promote_run = $GITHUB_RUN_ID, dry_run off."
            echo "Lullaby does not offer ${{ steps.detect.outputs.engine }} until then (DECISIONS P5-1)."
          } > "$body"
          release/gh-publish.sh issue "$title" "$body"

  # The owner tested a candidate (an earlier run's artifact, TEST key): sign those same
  # bytes with the release key and publish them. Nothing is built, so the bridge
  # published is the bridge that was played with.
  promote:
    needs: gate
    if: inputs.promote_run != ''
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      RUN_ID: ${{ inputs.promote_run }}
    steps:
      - uses: actions/checkout@v5

      - name: Where to publish (release/feed.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$DRY_RUN" = true ] || release/gh-publish.sh check-repo
          { echo "FEED=$(python3 -I release/feed.py config feed)"
            echo "MANIFEST_TAG=$(python3 -I release/feed.py config manifestTag)"; } >> "$GITHUB_ENV"

      - name: Keys
        env:
          LB_RELEASE_PRIVATE_KEY: ${{ secrets.LB_RELEASE_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          LB_RELEASE_PUBLIC_KEY: ${{ vars.LB_RELEASE_PUBLIC_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          mode=release; [ "$DRY_RUN" = true ] && mode=dry-run
          release/ci-keys.sh "$mode" "$RUNNER_TEMP/keys"

      - name: The candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RUN_ID" in ''|*[!0-9]*) echo "promote_run is '$RUN_ID', not a run id"; exit 1 ;; esac
          name=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json workflowName --jq .workflowName)
          conclusion=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
          [ "$name" = dormison-bridge ] && [ "$conclusion" = success ] \
            || { echo "run $RUN_ID is '$name' ($conclusion), not a successful dormison-bridge run"; exit 1; }
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name dormison-bridge --dir "$RUNNER_TEMP/run"
          entry=$(find "$RUNNER_TEMP/run" -name '*.entry.json' | head -1)
          [ -n "$entry" ] || { echo "run $RUN_ID left no bridge entry"; exit 1; }
          id=$(basename "$entry" .entry.json)
          src=$(dirname "$entry")/$id
          python3 -I - "$entry" "$src/$id.tar.xz" "$FEED" <<'PY'
          import hashlib, json, os, sys
          entry, tarball, feed = json.load(open(sys.argv[1])), sys.argv[2], sys.argv[3]
          data = open(tarball, "rb").read()
          if hashlib.sha256(data).hexdigest() != entry["sha256"] or len(data) != entry["sizeBytes"]:
              sys.exit(f"{tarball} is not the tarball its entry names")
          if entry["url"] != f"{feed}{entry['id']}/{entry['id']}.tar.xz":
              sys.exit(f"{entry['url']} is not under this feed ({feed})")
          print("candidate", entry["id"], entry["sha256"])
          PY
          { echo "ENTRY=$entry"; echo "SRC=$src"; echo "ID=$id"; } >> "$GITHUB_ENV"
          echo "### Promoting \`$id\` from run $RUN_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign with this run's key
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_KEY: ${{ vars.LB_RELEASE_PUBLIC_KEY }}
        run: |
          swiftc -O -o "$RUNNER_TEMP/verify-ed25519" engine/verify-ed25519.swift
          current=""
          if [ -n "$PUBLISHED_KEY" ] && release/gh-publish.sh fetch "$MANIFEST_TAG" bridge-manifest.json "$RUNNER_TEMP/current"; then
            release/gh-publish.sh verify "$PUBLISHED_KEY" "$RUNNER_TEMP/current/bridge-manifest.json"
            current="$RUNNER_TEMP/current/bridge-manifest.json"
            if python3 -I -c 'import json,sys; sys.exit(0 if any(e["id"] == sys.argv[2] for e in json.load(open(sys.argv[1]))["bridges"]) else 1)' "$current" "$ID"; then
              echo "$ID is published already; an id is never reused"; exit 1
            fi
          fi
          feed="$RUNNER_TEMP/feed"; mkdir -p "$feed/$ID" "$feed/manifest"
          cp "$SRC/$ID.tar.xz" "$feed/$ID/"
          [ -f "$SRC/$ID-debug.tar.xz" ] && cp "$SRC/$ID-debug.tar.xz" "$feed/$ID/"
          python3 -I release/feed.py publish-bridges --repo bridge/bridge-manifest.json \
            ${current:+--current "$current"} --out "$feed/manifest/bridge-manifest.json" "$ENTRY"
          swift release/sign.swift "$RUNNER_TEMP/keys/release.key" "$feed/$ID/$ID.tar.xz" "$feed/manifest/bridge-manifest.json"
          release/gh-publish.sh verify "$LB_RELEASE_KEY" "$feed/$ID/$ID.tar.xz"
          release/gh-publish.sh verify "$LB_RELEASE_KEY" "$feed/manifest/bridge-manifest.json"
          cp "$ENTRY" "$feed/"
          echo "FEED_DIR=$feed" >> "$GITHUB_ENV"

      - name: Keep the run's output
        uses: actions/upload-artifact@v5
        with:
          name: dormison-bridge-promoted
          path: ${{ runner.temp }}/feed

      - name: Publish
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          feed="$FEED_DIR"
          debug=""; [ -f "$feed/$ID/$ID-debug.tar.xz" ] && debug="$feed/$ID/$ID-debug.tar.xz"
          # shellcheck disable=SC2086
          release/gh-publish.sh upload "$ID" "Steam bridge $ID" "$feed/$ID/$ID.tar.xz" "$feed/$ID/$ID.tar.xz.sig" $debug
          release/gh-publish.sh upload "$MANIFEST_TAG" "Signed manifests" \
            "$feed/manifest/bridge-manifest.json" "$feed/manifest/bridge-manifest.json.sig"
          back="$RUNNER_TEMP/published"
          release/gh-publish.sh fetch "$MANIFEST_TAG" bridge-manifest.json "$back"
          cmp "$back/bridge-manifest.json" "$feed/manifest/bridge-manifest.json"
          release/gh-publish.sh fetch "$ID" "$ID.tar.xz" "$back"
          cmp "$back/$ID.tar.xz" "$feed/$ID/$ID.tar.xz"
          release/gh-publish.sh verify "$LB_RELEASE_KEY" "$back/$ID.tar.xz"
          echo "Published $ID (the tested bytes) and the bridge manifest; both read back and match." >> "$GITHUB_STEP_SUMMARY"
